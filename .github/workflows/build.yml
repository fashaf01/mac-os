name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  windows:
    name: MSVC ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -A x64 -DMACDOCK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Upload MacDock.exe
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: MacDock
          path: build/Release/MacDock.exe

  # The dock itself is Windows-only, but the magnification and contrast maths
  # are portable, so they get a second compiler's opinion for free.
  portable-tests:
    name: Portable tests (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suites
        run: ./tests/run.sh
